<style>
/* Codex supplies these values; keep the panel surface and neutral controls in the host palette. */
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, Canvas);
  --fg: var(--color-text-primary, CanvasText);
  --muted: var(--color-text-secondary, GrayText);
  --border: var(--color-border-secondary, color-mix(in srgb, CanvasText 12%, Canvas));
  --accent: var(--color-ring-primary, LinkText);
  --graph-current: var(--color-text-info, var(--fg));
  --graph-remote: var(--color-text-warning, var(--fg));
  --graph-1: var(--color-text-success, var(--fg));
  --graph-2: var(--color-text-danger, var(--fg));
  --graph-3: var(--color-text-info, var(--fg));
  --graph-4: var(--color-text-secondary, var(--fg));
  --graph-5: var(--fg);
  --space-unit: var(--spacing, 4px);
  --control-size: var(--spacing-token-button-composer, calc(var(--space-unit) * 7));
  --control-padding-inline: var(--spacing-button-toolbar-inline, calc(var(--space-unit) * 2));
  --icon-size: calc(var(--space-unit) * 4);
  --icon-size-sm: calc(var(--space-unit) * 3);
  --toolbar-gap: var(--space-unit);
  --app-inline-inset: calc(var(--space-unit) * 2.5);
  --card-inset: var(--space-unit);
  --card-content-inline-inset: calc(var(--space-unit) * 1.5);
  --radius-action: var(--border-radius-lg);
  --radius-toolbar: var(--border-radius-lg);
  --radius-list: var(--border-radius-md);
  --radius-card: calc(var(--border-radius-xl) + var(--border-radius-xs));
  --radius-badge: var(--border-radius-sm);
  --border-subtle: color-mix(in srgb, var(--color-border-secondary) 62.5%, transparent);
  --scrollbar-thumb: var(--color-border-secondary);
  --scrollbar-thumb-strong: var(--color-border-primary, var(--scrollbar-thumb));
  --resize-highlight: color-mix(in oklab, var(--fg) 25%, transparent);
  --danger: var(--color-text-danger, CanvasText);
  --success: var(--color-text-success, CanvasText);
  --warning: var(--color-text-warning, CanvasText);
  --detail-bg: color-mix(in srgb, var(--color-background-secondary) 70%, var(--color-background-primary));
  font-family: var(--font-sans);
  font-size: var(--font-text-sm-size);
  font-weight: var(--font-weight-normal);
  line-height: 1.4;
  background: var(--bg); color: var(--fg);
}
:root, #detail {
  --surface: color-mix(in oklab, var(--fg) 5%, var(--bg));
  --hover: color-mix(in oklab, var(--fg) 5%, transparent);
  --hover-surface: color-mix(in oklab, var(--fg) 5%, var(--bg));
  --selected: var(--color-background-disabled, color-mix(in oklab, var(--fg) 5%, transparent));
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent }
body { margin: 0 }
[hidden] { display: none !important }
:is(#history-scroll, #detail-summary, #files, #diff-notice):is(:hover, :active) { scrollbar-color: var(--scrollbar-thumb-strong) transparent }
@scope (#app) to (#diff-editor) {
button, input { font: inherit; color: inherit; min-width: 0 }
button { cursor: var(--interaction-cursor, default) }
button, input { border: 0; min-height: var(--control-size); padding: var(--space-unit) var(--control-padding-inline); background: transparent }
button { display: inline-flex; align-items: center; justify-content: center; gap: var(--card-content-inline-inset); border-radius: var(--radius-action) }
button:not(.step, .commit-row):not(:disabled):hover { background: var(--hover) }
button:disabled { cursor: default; opacity: .4; pointer-events: none }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
input { border-radius: var(--radius-action); background: var(--surface); border: 1px solid transparent }
input::placeholder { color: var(--muted); opacity: 1 }
@supports (corner-shape: superellipse(1.5)) {
  button:not(.commit-row), input, #search-field, .commit-row::before, .ref, #detail { corner-shape: superellipse(1.5) }
}
}
button svg { width: var(--icon-size); height: var(--icon-size); flex: none }
.spacer { flex: 1 }
#app { height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg) }
#header { flex: none; border-bottom: 1px solid var(--border) }
#toolbar { display: flex; align-items: center; gap: var(--toolbar-gap); min-height: calc(var(--space-unit) * 10); padding: var(--card-content-inline-inset) var(--app-inline-inset) }
#repository { max-width: 34% }
#branch { max-width: 50% }
#refresh, #toggle-search { color: var(--muted); flex: none }
#toggle-search[aria-expanded=true] { color: var(--fg); --button-surface: var(--selected) }
#searchbar { display: flex; align-items: center; gap: var(--toolbar-gap); padding: 0 var(--app-inline-inset) calc(var(--space-unit) * 2) }
#search-field { display: flex; align-items: center; gap: var(--card-content-inline-inset); flex: 1; min-width: 0; background: var(--surface); border-radius: var(--border-radius-md); padding-left: var(--control-padding-inline); color: var(--muted) }
#search-field > svg { width: var(--icon-size); height: var(--icon-size); flex: none }
#search { flex: 1; width: 100%; background: transparent; border: 0; outline: none; border-radius: 0; padding-left: 0; color: var(--fg) }
#search::-webkit-search-cancel-button { appearance: none; width: var(--icon-size); height: var(--icon-size); background: var(--muted); mask: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%20fill%3D%22none%22%20aria-hidden%3D%22true%22%20data-codex-icon%3D%22xmark-md-light-16%22%3E%3Cpath%20d%3D%22M10.962%204.29539C11.1669%204.09057%2011.4992%204.09076%2011.7042%204.29539C11.9092%204.50039%2011.9091%204.83255%2011.7042%205.03758L8.74229%207.99949L11.7052%2010.9624C11.9097%2011.1673%2011.9097%2011.4996%2011.7052%2011.7046C11.5003%2011.9095%2011.168%2011.9093%2010.963%2011.7046L8.0001%208.74168L5.03721%2011.7046C4.83216%2011.9093%204.49994%2011.9095%204.29502%2011.7046C4.09047%2011.4996%204.09045%2011.1673%204.29502%2010.9624L7.25791%207.99949L4.296%205.03758C4.09101%204.83255%204.09099%204.5004%204.296%204.29539C4.50105%204.09079%204.8333%204.09054%205.03819%204.29539L8.0001%207.2573L10.962%204.29539Z%22%20fill%3D%22currentColor%22%2F%3E%3C%2Fsvg%3E") center / contain no-repeat }
#search-count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: var(--font-text-xs-size); white-space: nowrap }
#search-count:empty { display: none }
.step { width: var(--control-size); height: var(--control-size); flex: none; padding: calc((var(--control-size) - var(--icon-size)) / 2); border-radius: var(--radius-toolbar); color: var(--muted); background: var(--button-surface, transparent); transition: background-color 150ms ease, color 150ms ease, opacity 150ms ease }
.step:not(:disabled):hover { background: var(--hover) }
.error { margin: 8px var(--app-inline-inset) 0; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-list); color: var(--fg); display: flex; gap: 8px; align-items: center }
.error::before { content: '!'; color: var(--danger); font-weight: 700; width: 16px; text-align: center; flex: none }
.error[data-tone=info]::before { content: 'i'; color: var(--accent) }
.error span { flex: 1; white-space: pre-wrap; overflow-wrap: anywhere }
#retry, #layout-retry { color: var(--accent); flex: none }
#toolbar-skeleton { display: flex; align-items: center; gap: 8px; min-height: calc(var(--space-unit) * 10); padding: var(--card-content-inline-inset) var(--app-inline-inset) }
.skeleton-line, .skeleton-block { display: block; background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: var(--border-radius-xs); animation: skeleton-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite }
#toolbar-skeleton .skeleton-line { width: 112px; height: 16px }
#toolbar-skeleton .skeleton-block { width: 28px; height: 28px; margin-left: auto }
#history-skeleton { padding: 4px 8px }
.skeleton-row { display: flex; align-items: center; gap: 10px; height: 30px }
.skeleton-row::before { content: ''; width: 10px; height: 10px; margin-left: 10px; border-radius: 50%; background: color-mix(in srgb, var(--fg) 10%, transparent); animation: skeleton-pulse 2s cubic-bezier(.4, 0, .6, 1) infinite }
.skeleton-row .skeleton-line { width: 42%; height: 12px }
.skeleton-row:nth-child(3n) .skeleton-line { width: 26% }
.skeleton-row:nth-child(2n) .skeleton-line { width: 35% }
@keyframes skeleton-pulse { 50% { opacity: .5 } }
#content { display: flex; flex: 1; min-height: 0 }
#history-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0 }
#history-table { width: 100% }
#load-more { display: flex; margin: 8px auto; color: var(--muted) }
#history-scroll { flex: 1; overflow: auto; overflow-x: hidden; position: relative; overflow-anchor: none; padding-block: calc(var(--space-unit) / 2) }
#rows { width: 100% }
.commit-entry { min-width: 0 }
#detail-row { position: relative; padding: 6px 8px 6px calc(var(--graph-width, 22px) + 8px) }
#detail-graph { position: absolute; top: 0; bottom: 0; left: 8px; width: var(--graph-width, 20px); pointer-events: none }
#detail-graph svg { display: block; height: 100% }
.commit-row { --row-bg: var(--bg); display: flex; align-items: center; justify-content: flex-start; gap: 0; position: relative; isolation: isolate; height: 30px; min-height: 30px; width: 100%; padding: 0 12px 0 8px; border-radius: 0; text-align: left; background: transparent; white-space: nowrap }
.commit-row:hover { --row-bg: var(--hover-surface); background: transparent }
.commit-row[data-selected] { --row-bg: var(--selected-surface, var(--surface)) }
.commit-row::before { content: ''; position: absolute; inset: 2px 4px; z-index: -1; border-radius: var(--border-radius-md); pointer-events: none; background: var(--row-bg) }
.commit-row[data-selected]::before { background: var(--row-bg) }
.commit-row:focus-visible { outline: none }
.commit-row:focus-visible::before { outline: 2px solid var(--accent); outline-offset: -2px }
.commit-row mark[data-search-match] { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--fg); border-radius: calc(var(--border-radius-xs) / 2); padding: 0 }
.commit-row mark[data-search-match][data-active] { background: color-mix(in srgb, var(--accent) 32%, transparent) }
.search-context { flex: 0 1 auto; min-width: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: var(--font-text-xs-size) }
.commit-row > .graph { display: block; flex: none; align-self: stretch; height: 30px }
.commit-row[aria-expanded=true] > .graph .node-edge { stroke-width: 3px }
.graph circle { stroke: var(--bg) }
.commit-row:hover .graph circle:first-of-type, .commit-row.is-focused[data-selected] .graph circle:first-of-type { stroke: transparent }
.commit-row:hover .graph circle:nth-of-type(2) { stroke: var(--hover) }
#rows:has(.commit-row:focus) .commit-row[data-selected] .graph circle:nth-of-type(2) { stroke: var(--selected) }
.commit-row.is-focused .graph circle:nth-of-type(2) { stroke: var(--selected-surface, var(--surface)) }
.commit-row.current:hover .graph circle:last-of-type { fill: var(--hover) }
.commit-row .message { display: flex; align-items: center; flex: 1; min-width: 0; gap: 8px; overflow: hidden }
.subject { overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto }
.author { flex: 0 1 auto; max-width: 20%; margin-left: 12px; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: var(--font-text-xs-size) }
code, pre { font-family: var(--font-mono) }
.badges { display: flex; flex: 0 1 auto; min-width: 0; max-width: 50%; align-items: center; gap: 4px; overflow: hidden }
.badges:empty { display: none }
.ref { --ref-color: var(--fg); display: inline-flex; align-items: center; gap: 4px; flex: none; min-width: 0; font-size: var(--font-text-xs-size); line-height: 18px; height: 20px; border: 1px solid var(--border); border-radius: var(--radius-badge); padding: 0 6px; background: var(--surface); color: var(--ref-color) }
.badges .ref { flex: 0 1 auto; overflow: hidden }
.ref-name { min-width: 0; overflow: hidden; text-overflow: ellipsis }
.empty { color: var(--muted); text-align: center; min-height: 100%; padding: 32px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.6; overflow-wrap: anywhere }
.empty strong { display: block; color: var(--fg); font-weight: var(--font-weight-medium); margin-bottom: 4px }
#detail { --bg: var(--detail-bg); position: sticky; left: 0; width: calc(var(--history-viewport-width, 100vw) - var(--graph-width, 20px) - 16px); height: var(--detail-height, 420px); display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: var(--card-inset); border: 0; border-radius: var(--radius-card); background: var(--bg); box-shadow: inset 0 0 0 1px var(--border-subtle) }
#detail-header { display: flex; align-items: center; flex-wrap: wrap; flex: none; gap: var(--toolbar-gap); min-height: var(--control-size) }
#detail-header button { font-size: var(--font-text-xs-size); color: var(--muted) }
#detail-identity { display: flex; align-items: center; flex-wrap: wrap; gap: var(--toolbar-gap) var(--control-padding-inline); flex: 1; min-width: 0; padding: 0 var(--card-content-inline-inset) }
#detail-hash { flex: none; max-width: 100%; font-size: var(--font-text-xs-size); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
#detail-summary { padding: var(--card-inset) var(--card-content-inline-inset) var(--card-content-inline-inset); overflow: auto; flex: 1; min-height: 0 }
#commit-refs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; min-width: 0; font-size: var(--font-text-xs-size); color: var(--muted) }
#commit-refs:empty { display: none }
#commit-refs .ref { flex: 0 1 auto; max-width: 100%; height: auto }
#commit-refs .ref-name { white-space: normal; overflow-wrap: anywhere }
#commit-message { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; margin: 0 0 8px }
#commit-message.skeleton-line { width: 64%; height: 14px; margin: 4px 0 16px }
#commit-meta { display: flex; align-items: baseline; gap: 12px; min-width: 0; font-size: var(--font-text-xs-size); line-height: 1.7; color: var(--muted); white-space: nowrap }
#commit-meta span { min-width: 0; overflow: hidden; text-overflow: ellipsis }
#commit-meta span:last-child { flex: none }
#parent-label { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--muted) }
#files { min-height: 0; flex: 1; overflow: auto; padding: 0 6px 4px 3px }
#files button { border-radius: var(--radius-list); display: flex; justify-content: flex-start; width: 100%; gap: 8px; text-align: left; padding: 4px 6px; font-size: var(--font-text-sm-size) }
#files button[aria-selected=true] { background: var(--selected) }
.file-status { flex: none; margin-left: auto; color: var(--muted); font-family: var(--font-mono); font-size: var(--font-text-xs-size) }
.file-status.A { color: var(--success) }
.file-status.D { color: var(--danger) }
.file-path, .file-directory { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.file-directory { color: var(--muted); max-width: 45%; font-size: var(--font-text-xs-size) }
#changes-header { display: flex; align-items: center; flex-wrap: wrap; gap: var(--toolbar-gap); min-height: calc(var(--space-unit) * 9); padding: var(--card-inset) 0; flex: none }
#files-label { flex: 0 1 auto; max-width: 50%; min-width: 0 }
#diff-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--font-text-xs-size); color: var(--muted) }
#open-file { flex: none; color: var(--muted) }
#expand-detail[aria-pressed=false] .restore-icon, #expand-detail[aria-pressed=true] .expand-icon { display: none }
#diff-mode[data-mode=inline] .diff-icon-inline, #diff-mode[data-mode=split] .diff-icon-split { display: none }
#diff-revisions { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 4px 6px; color: var(--muted); font-size: var(--font-text-xs-size) }
#diff-revisions span { overflow-wrap: anywhere }
#diff-body { flex: 1; position: relative; min-height: 80px }
#diff-editor { position: absolute; inset: 0 }
#diff-notice { white-space: pre-wrap; color: var(--muted); padding: 16px; overflow: auto; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center }
#diff-skeleton { padding: 16px }
#diff-skeleton .skeleton-line { height: 12px; width: 75%; margin-bottom: 14px }
#diff-skeleton .skeleton-line:nth-child(2) { width: 55% }
#diff-status { min-height: 22px; flex-shrink: 0; padding: 3px 6px; color: var(--muted); font-size: var(--font-text-xs-size) }
#history-body, #detail-content, #changes-pane, #diff-content { display: flex; flex-direction: column; flex: 1; min-height: 0; min-width: 0 }
#detail-content { overflow: hidden }
#detail-body { display: flex; flex: 1; min-height: 0; min-width: 0 }
#summary-pane, #files-pane, #diff-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden }
#summary-pane { flex: none; height: var(--summary-height, auto); max-height: var(--summary-height, min(160px, calc(var(--detail-height, 420px) / 3))) }
#files-pane { width: var(--files-width, 220px); flex: none }
#diff-pane { flex: 1 }
#changes-heading { display: flex; align-items: center; gap: var(--card-content-inline-inset); flex: 1; min-width: 0; padding: var(--card-inset) var(--card-content-inline-inset); color: var(--muted) }
#changes-heading span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
#history-pane.detail-maximized #searchbar,
#history-pane.detail-maximized .commit-entry:not(.is-open), #history-pane.detail-maximized #load-more { display: none }
#history-pane.detail-maximized #history-scroll { padding-bottom: 0 }
#history-pane.detail-maximized :is(#history-table, #rows, .commit-entry.is-open) { height: 100% }
#history-pane.detail-maximized .commit-entry.is-open { display: flex; flex-direction: column; min-height: 0 }
#history-pane.detail-maximized .commit-row { flex: none }
#history-pane.detail-maximized #detail-row { flex: 1; min-height: 0 }
#history-pane.detail-maximized #detail { height: 100% }
.panel-resize { position: relative; flex: 0 0 1px; background: var(--border); cursor: row-resize; touch-action: none; user-select: none; z-index: 2; outline: none }
#detail-resize { position: absolute; bottom: 0; left: var(--radius-card); right: var(--radius-card); height: 1px; background: transparent }
#detail-resize::before { content: none }
.panel-resize::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to right in oklab, transparent, var(--resize-highlight), transparent); opacity: 0; pointer-events: none }
.panel-resize::after { content: ''; position: absolute; left: 0; right: 0; top: -7.5px; height: 16px }
.panel-resize:hover::before, .panel-resize:focus-visible::before, .panel-resize[data-active]::before { opacity: 1 }
.panel-resize:focus-visible::after { outline: 2px solid var(--accent); outline-offset: -2px }
.panel-resize[aria-orientation=vertical] { cursor: col-resize }
.panel-resize[aria-orientation=vertical]::before { background: linear-gradient(to bottom in oklab, transparent, var(--resize-highlight), transparent) }
.panel-resize[aria-orientation=vertical]::after { top: 0; bottom: 0; left: -7.5px; right: auto; width: 16px; height: auto }
.panel-resize[aria-disabled=true] { pointer-events: none }
.panel-resizing, .panel-resizing * { cursor: var(--resize-cursor) !important; user-select: none !important }
@media (forced-colors: active) {
  #search-field:focus-within { outline: 2px solid Highlight; outline-offset: -2px }
}
@media (prefers-reduced-motion: reduce) {
  .step { transition: none }
  .skeleton-line, .skeleton-block, .skeleton-row::before { animation: none }
}
@media (max-width: 540px) {

#search-count { font-size: var(--font-text-xs-size) }
}
